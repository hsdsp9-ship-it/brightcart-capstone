bundle:
  name: brightcart_capstone

# workspace.host is intentionally omitted: Databricks does not support variable
# interpolation for authentication fields. Set the DATABRICKS_HOST (and
# DATABRICKS_TOKEN) environment variables at run time instead (see
# .github/workflows/deploy.yml).

variables:
  catalog_name:
    default: harpalsingh
  schema_name:
    default: brightcart

resources:
  jobs:
    brightcart_batch_pipeline:
      name: BrightCart Batch Pipeline
      job_clusters:
        - job_cluster_key: batch_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: r5d.large
            num_workers: 1
            runtime_engine: PHOTON
            data_security_mode: USER_ISOLATION
      tasks:
        - task_key: bronze_ingestion
          job_cluster_key: batch_cluster
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py
        - task_key: silver_enrichment
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: batch_cluster
          notebook_task:
            notebook_path: ./notebooks/03_silver_enrichment.py
        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_enrichment
          job_cluster_key: batch_cluster
          notebook_task:
            notebook_path: ./notebooks/04_gold_aggregation.py
      queue:
        enabled: true

targets:
  dev:
    mode: development
    default: true
