bundle:
  name: brightcart_capstone

# workspace.host is intentionally omitted: Databricks does not support variable
# interpolation for authentication fields. Set the DATABRICKS_HOST (and
# DATABRICKS_TOKEN) environment variables at run time instead (see
# .github/workflows/deploy.yml).

variables:
  catalog_name:
    default: harpalsingh
  schema_name:
    default: brightcart

resources:
  jobs:
    brightcart_batch_pipeline:
      name: BrightCart Batch Pipeline
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion
        - task_key: silver_enrichment
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ./notebooks/03_silver_enrichment
        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_enrichment
          notebook_task:
            notebook_path: ./notebooks/04_gold_aggregation
      queue:
        enabled: true

targets:
  dev:
    mode: development
    default: true
