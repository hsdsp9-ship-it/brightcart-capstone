bundle:
  name: brightcart_capstone

# workspace.host is intentionally omitted: Databricks does not support variable
# interpolation for authentication fields. Set the DATABRICKS_HOST (and
# DATABRICKS_TOKEN) environment variables at run time instead (see
# .github/workflows/deploy.yml).

variables:
  catalog_name:
    default: harpalsingh
  schema_name:
    default: brightcart
  existing_cluster_id:
    description: Existing all-purpose cluster ID to run the job tasks on
    default: 0724-105653-1bw7ko28

resources:
  jobs:
    brightcart_batch_pipeline:
      name: BrightCart Batch Pipeline
      tasks:
        - task_key: bronze_ingestion
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py
            base_parameters:
              catalog: ${var.catalog_name}
              schema: ${var.schema_name}
        - task_key: silver_enrichment
          depends_on:
            - task_key: bronze_ingestion
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/03_silver_enrichment.py
            base_parameters:
              catalog: ${var.catalog_name}
              schema: ${var.schema_name}
        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_enrichment
          existing_cluster_id: ${var.existing_cluster_id}
          notebook_task:
            notebook_path: ./notebooks/04_gold_aggregation.py
            base_parameters:
              catalog: ${var.catalog_name}
              schema: ${var.schema_name}
      queue:
        enabled: true

targets:
  dev:
    mode: development
    default: true
