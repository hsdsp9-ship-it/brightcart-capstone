name: Deploy BrightCart Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Configure Databricks auth
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mkdir -p ~/.databricks
          cat <<EOF > ~/.databrickscfg
          [DEFAULT]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN
          EOF

      - name: Validate bundle
        run: databricks bundle validate --var="databricks_host=${{ secrets.DATABRICKS_HOST }}"

      - name: Deploy bundle
        run: databricks bundle deploy --target dev --var="databricks_host=${{ secrets.DATABRICKS_HOST }}"

      - name: Run batch job
        run: databricks bundle run brightcart_batch_pipeline --target dev --var="databricks_host=${{ secrets.DATABRICKS_HOST }}"
